<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO NYENTRIX TRANS - Manajemen Armada</title>
    <!-- Tailwind CSS untuk Desain Responsif HP -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">PO NYENTRIX TRANS</h1>
        <p class="text-sm text-blue-100">Manajemen Jadwal Armada Wisata</p>
    </header>

    <!-- Navigasi Tab -->
    <div class="flex justify-around bg-white shadow-sm border-b sticky top-0 z-50">
        <button onclick="switchTab('jadwal')" id="btn-jadwal" class="py-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 w-1/3 text-center text-sm">Lihat Jadwal</button>
        <button onclick="switchTab('detail')" id="btn-detail" class="py-3 px-4 font-semibold text-gray-500 w-1/3 text-center text-sm">Detail Order</button>
        <button onclick="switchTab('foto')" id="btn-foto" class="py-3 px-4 font-semibold text-gray-500 w-1/3 text-center text-sm">Foto Trip</button>
    </div>

    <main class="p-4 max-w-md mx-auto">
        
        <!-- TAB 1: LIHAT JADWAL -->
        <section id="tab-jadwal" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="font-bold text-gray-700 mb-2">Kalender Jadwal Sebulan Penuh</h2>
                <div class="flex justify-between items-center mb-4">
                    <span id="current-month" class="font-semibold text-blue-600">Bulan Ini</span>
                    <button onclick="openAdminLogin()" class="bg-gray-800 text-white text-xs px-3 py-1.5 rounded-lg">🔑 Login Admin</button>
                </div>
                <!-- Tampilan Daftar/Grid Jadwal -->
                <div id="schedule-list" class="space-y-3">
                    <p class="text-sm text-gray-400 text-center py-4">Memuat data jadwal...</p>
                </div>
            </div>

            <!-- Form Input Admin (Hidden by default) -->
            <div id="admin-panel" class="bg-amber-50 border border-amber-200 p-4 rounded-xl hidden">
                <h3 class="font-bold text-amber-800 mb-2 text-sm">Panel Admin: Tambah Jadwal & Order</h3>
                <form id="order-form" class="space-y-3 text-sm">
                    <input type="date" id="tgl-berangkat" class="w-full p-2 border rounded" required>
                    <select id="pilih-armada" class="w-full p-2 border rounded" required>
                        <option value="">Pilih Armada</option>
                        <option value="Armada 01">Armada 01</option>
                        <option value="Armada 02">Armada 02</option>
                        <option value="Armada 03">Armada 03</option>
                        <option value="Armada 04">Armada 04</option>
                    </select>
                    <input type="text" id="tujuan" placeholder="Tujuan Wisata" class="w-full p-2 border rounded" required>
                    <input type="text" id="penjemputan" placeholder="Lokasi Penjemputan" class="w-full p-2 border rounded" required>
                    <input type="time" id="jam-jemput" class="w-full p-2 border rounded" required>
                    <input type="number" id="nilai-sewa" placeholder="Nilai Sewa (Rp)" class="w-full p-2 border rounded" required>
                    <textarea id="lain-lain" placeholder="Catatan Lain-lain" class="w-full p-2 border rounded"></textarea>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Simpan Order</button>
                </form>
            </div>
        </section>

        <!-- TAB 2: DETAIL ORDER -->
        <section id="tab-detail" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="font-bold text-gray-700 mb-3">Draf Detail Order Armada</h2>
                <div id="detail-order-list" class="space-y-3">
                    <p class="text-sm text-gray-400 text-center py-4">Belum ada order masuk.</p>
                </div>
            </div>
        </section>

        <!-- TAB 3: FOTO TRIP -->
        <section id="tab-foto" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <h2 class="font-bold text-gray-700">Laporan Foto Trip Armada</h2>
                <div class="border-2 border-dashed border-gray-300 p-3 rounded-lg text-center">
                    <input type="file" id="upload-foto" accept="image/*" class="text-xs mb-2">
                    <input type="text" id="ket-foto" placeholder="Keterangan Foto / No Armada" class="w-full p-2 border rounded text-sm mb-2">
                    <button onclick="uploadFotoTrip()" class="w-full bg-green-600 text-white py-2 rounded text-sm font-bold">Upload Foto</button>
                </div>
                <div id="gallery-list" class="grid grid-cols-2 gap-2 pt-2">
                    <!-- Foto galeri muncul di sini -->
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Sederhana untuk Navigasi & Simulasi -->
    <script>
        function switchTab(tab) {
            ['jadwal', 'detail', 'foto'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                document.getElementById('btn-' + t).classList.add('text-gray-500');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('btn-' + tab).classList.remove('text-gray-500');
        }

        function openAdminLogin() {
            let pwd = prompt("Masukkan Password Admin:");
            if (pwd === "nyentrix123") { // Password default admin
                document.getElementById('admin-panel').classList.remove('hidden');
                alert("Login Admin Berhasil!");
            } else if (pwd !== null) {
                alert("Password Salah!");
            }
        }

        // Simulasi Data Sementara (Nanti dihubungkan ke Database Cloud)
        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Fitur simpan aktif! (Hubungkan ke Firebase untuk sinkronisasi HP otomatis)");
        });

        function uploadFotoTrip() {
            alert("Fitur upload foto trip siap digunakan.");
        }
    </script>
</body>
</html>
