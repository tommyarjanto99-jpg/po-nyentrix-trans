<script>
        // PASTE URL GOOGLE APPS SCRIPT KAMU DI SINI:
        const API_URL = "https://script.google.com/macros/s/AKfycbyNVrGzelBA4vEzSCJasPFh92Mk84vlXE-MkM8CCrg-vdKkpbNiMaYZYjFo3mjt47u10g/exec";

        const defaultArmadaNames = ["Tomtom", "Basir", "Sitoen", "Abi"];

        let armadaList = [...defaultArmadaNames];
        let orders = [];
        let photos = [];
        let isAdmin = false;
        let currentDate = new Date();
        let lastDataHash = ""; // Cache untuk sinkronisasi real-time

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('nyentrix_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').innerText = '☀️';
                document.getElementById('themeText').innerText = 'Light';
            }
            populateArmadaDropdowns();
            renderCalendar();
            renderLegend();

            // Muat data awal & aktifkan auto-sync real-time setiap 5 detik
            loadDataFromCloud();
            setInterval(loadDataFromCloud, 5000);
        });

        // ------------------ AUTO SYNC REAL-TIME ------------------
        async function loadDataFromCloud() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                // Cek apakah ada perubahan data baru
                const currentHash = JSON.stringify(data);
                if (currentHash === lastDataHash) return; // Jika tidak ada perubahan, hentikan agar UI tidak kedip
                
                lastDataHash = currentHash;

                if (data.armada && data.armada.length > 0) {
                    armadaList = data.armada;
                }
                orders = data.orders || [];
                photos = data.photos || [];

                populateArmadaDropdowns();
                renderCalendar();
                renderLegend();
                renderOrder();
                renderGallery();
            } catch (err) {
                console.error("Gagal sinkronisasi data dari Cloud:", err);
            }
        }

        async function sendToCloud(action, payload) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: action, data: payload, id: payload ? payload.id : null })
                });
                setTimeout(loadDataFromCloud, 1000); // Tarik ulang data terbaru
            } catch (err) {
                alert("Gagal menyimpan ke server!");
            }
        }

        // ------------------ FUNGSI KONTROL UTAMA ------------------
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('nyentrix_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = isDark ? 'Light' : 'Dark';
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('admin-pass');
            const toggleBtn = document.querySelector('.toggle-pwd-btn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-card').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            if(element) element.classList.add('active');

            if(tabId === 'jadwal') renderCalendar();
            if(tabId === 'order') renderOrder();
            if(tabId === 'foto') renderGallery();
        }

        function populateArmadaDropdowns() {
            const inputSelect = document.getElementById('input-armada');
            const filterSelect = document.getElementById('filter-armada');
            const fotoSelect = document.getElementById('foto-armada');

            inputSelect.innerHTML = '';
            fotoSelect.innerHTML = '';
            filterSelect.innerHTML = '<option value="semua">Semua Armada</option>';

            armadaList.forEach((armada, index) => {
                inputSelect.innerHTML += `<option value="${index}">${armada}</option>`;
                fotoSelect.innerHTML += `<option value="${index}">${armada}</option>`;
                filterSelect.innerHTML += `<option value="${index}">${armada}</option>`;
            });

            for(let i = 0; i < 4; i++) {
                const inputRename = document.getElementById(`rename-armada-${i}`);
                if(inputRename) inputRename.value = armadaList[i] || '';
            }
        }

        function simpanNamaArmada() {
            let newNames = [];
            for(let i = 0; i < 4; i++) {
                const val = document.getElementById(`rename-armada-${i}`).value.trim();
                newNames.push(val || armadaList[i]);
            }
            armadaList = newNames;
            populateArmadaDropdowns();
            renderCalendar();
            renderLegend();
            
            sendToCloud("saveArmada", newNames);
            alert('Nama armada berhasil diperbarui ke semua user!');
        }

        function renderLegend() {
            const legContainer = document.getElementById('legend-container');
            legContainer.innerHTML = '';
            armadaList.forEach((armada, idx) => {
                legContainer.innerHTML += `
                    <div style="display:flex; align-items:center; gap:4px; font-size:0.75rem;">
                        <span class="badge armada-${idx % 4}" style="padding:2px 6px;">${armada}</span>
                    </div>
                `;
            });
        }

        function loginAdmin() {
            let pass = document.getElementById('admin-pass').value;
            if(pass === 'nyentrix123') {
                isAdmin = true;
                document.getElementById('admin-status').innerHTML = 'Status: <b style="color:#10b981;">Admin (Logged In)</b>';
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('logout-section').classList.remove('hidden');
                
                document.getElementById('admin-only-notice').classList.add('hidden');
                document.getElementById('form-admin-order').classList.remove('hidden');
                document.getElementById('form-custom-armada').classList.remove('hidden');
                document.getElementById('form-foto-admin').classList.remove('hidden');
                
                renderCalendar();
                renderOrder();
                alert('Berhasil Login sebagai Admin!');
            } else {
                alert('Password Salah!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-status').innerHTML = 'Status: <b>User (Viewer)</b>';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('logout-section').classList.add('hidden');
            
            document.getElementById('admin-only-notice').classList.remove('hidden');
            document.getElementById('form-admin-order').classList.add('hidden');
            document.getElementById('form-custom-armada').classList.add('hidden');
            document.getElementById('form-foto-admin').classList.add('hidden');
            
            renderCalendar();
            renderOrder();
            alert('Berhasil Logout.');
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            document.getElementById('calendar-title').innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            const calendarBody = document.getElementById('calendar-body');
            calendarBody.innerHTML = '';

            for (let i = firstDay - 1; i >= 0; i--) {
                let cell = document.createElement('div');
                cell.className = 'calendar-day-cell other-month';
                cell.innerHTML = `<span class="day-number">${prevMonthDays - i}</span>`;
                calendarBody.appendChild(cell);
            }

            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                let cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    cell.classList.add('today');
                }

                let dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                let dayNum = document.createElement('span');
                dayNum.className = 'day-number';
                dayNum.innerText = day;
                cell.appendChild(dayNum);

                let dayOrders = orders.filter(o => o.tanggal === dateString);
                dayOrders.forEach(ord => {
                    let idx = ord.armadaIndex || 0;
                    let namaArmada = armadaList[idx] || `Armada ${parseInt(idx)+1}`;
                    
                    let chip = document.createElement('div');
                    chip.className = `event-chip armada-${idx % 4}`;
                    chip.innerText = `${namaArmada} (${ord.tujuan})`;
                    chip.title = `${namaArmada}\nTujuan: ${ord.tujuan}\nJemput: ${ord.lokasi}`;
                    
                    if (isAdmin) {
                        chip.onclick = () => hapusOrder(ord.id);
                    }
                    cell.appendChild(chip);
                });

                calendarBody.appendChild(cell);
            }

            let totalCells = firstDay + daysInMonth;
            let nextDays = 7 - (totalCells % 7);
            if (nextDays < 7) {
                for (let j = 1; j <= nextDays; j++) {
                    let cell = document.createElement('div');
                    cell.className = 'calendar-day-cell other-month';
                    cell.innerHTML = `<span class="day-number">${j}</span>`;
                    calendarBody.appendChild(cell);
                }
            }
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function simpanData() {
            let armadaIndex = document.getElementById('input-armada').value;
            let newOrder = {
                id: Date.now(),
                armadaIndex: armadaIndex,
                tanggal: document.getElementById('input-tanggal').value,
                tujuan: document.getElementById('input-tujuan').value,
                lokasi: document.getElementById('input-lokasi').value,
                jam: document.getElementById('input-jam').value,
                harga: document.getElementById('input-harga').value,
                catatan: document.getElementById('input-catatan').value
            };

            if(!newOrder.tanggal || !newOrder.tujuan) {
                alert('Tanggal dan Tujuan wajib diisi!');
                return;
            }

            orders.push(newOrder);
            sendToCloud("saveOrder", newOrder);
            alert('Jadwal berhasil disimpan & disinkronkan ke cloud!');
            
            document.getElementById('input-tujuan').value = '';
            document.getElementById('input-lokasi').value = '';
            document.getElementById('input-harga').value = '';
            document.getElementById('input-catatan').value = '';
            
            renderCalendar();
            const firstCard = document.querySelector('.card-menu-1');
            switchTab('jadwal', firstCard);
        }

        function hapusOrder(id) {
            if(!isAdmin) {
                alert('Hanya Admin yang diizinkan untuk menghapus jadwal.');
                return;
            }
            if(confirm('Yakin ingin menghapus jadwal ini?')) {
                orders = orders.filter(o => o.id != id);
                sendToCloud("deleteOrder", { id: id });
                renderCalendar();
                renderOrder();
            }
        }

        function renderOrder() {
            let filter = document.getElementById('filter-armada').value;
            let container = document.getElementById('list-order-detail');
            container.innerHTML = '';

            let filtered = filter === 'semua' ? orders : orders.filter(o => o.armadaIndex == filter);

            if(filtered.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Tidak ada detail order untuk armada ini.</p>';
                return;
            }

            filtered.forEach(ord => {
                let div = document.createElement('div');
                div.className = 'card';
                let idx = ord.armadaIndex || 0;
                let namaArmada = armadaList[idx] || `Armada ${parseInt(idx)+1}`;

                let deleteBtnHtml = isAdmin 
                    ? `<button class="btn-delete" onclick="hapusOrder(${ord.id})">🗑️ Hapus Jadwal</button>` 
                    : '';

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span class="badge armada-${idx % 4}">${namaArmada}</span>
                        <span style="font-weight:700; font-size:0.9rem;">📅 ${ord.tanggal}</span>
                    </div>
                    <ul style="padding-left:1.2rem; margin:0; font-size:0.9rem; line-height:1.6;">
                        <li><b>Tujuan:</b> ${ord.tujuan}</li>
                        <li><b>Penjemputan:</b> ${ord.lokasi}</li>
                        <li><b>Jam Jemput:</b> ${ord.jam}</li>
                        <li><b>Nilai Sewa:</b> Rp ${Number(ord.harga || 0).toLocaleString()}</li>
                        <li><b>Lain-lain:</b> ${ord.catatan || '-'}</li>
                    </ul>
                    ${deleteBtnHtml}
                `;
                container.appendChild(div);
            });
        }

        function uploadFoto() {
            let fileInput = document.getElementById('input-file-foto');
            let armadaIndex = document.getElementById('foto-armada').value;
            let ket = document.getElementById('ket-foto').value;

            if(fileInput.files.length === 0) {
                alert('Pilih foto terlebih dahulu!');
                return;
            }

            let reader = new FileReader();
            reader.onload = function(e) {
                let newPhoto = {
                    armadaIndex: armadaIndex,
                    url: e.target.result,
                    keterangan: ket
                };
                photos.push(newPhoto);
                sendToCloud("savePhoto", newPhoto);
                alert('Foto berhasil diunggah!');
                renderGallery();
                document.getElementById('ket-foto').value = '';
                fileInput.value = '';
            }
            reader.readAsDataURL(fileInput.files[0]);
        }

        function renderGallery() {
            let container = document.getElementById('gallery-container');
            container.innerHTML = '';
            if(photos.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Belum ada foto trip.</p>';
                return;
            }
            photos.forEach(p => {
                let div = document.createElement('div');
                div.className = 'gallery-item card';
                let idx = p.armadaIndex || 0;
                let namaArmada = armadaList[idx] || `Armada ${parseInt(idx)+1}`;

                div.innerHTML = `
                    <img src="${p.url}">
                    <div style="margin-top:6px;">
                        <span class="badge armada-${idx % 4}" style="font-size:0.7rem; padding:2px 6px;">${namaArmada}</span>
                        <p style="font-size:0.8rem; margin:4px 0 0 0;">${p.keterangan || ''}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
